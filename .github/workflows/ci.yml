name: ci
on:
  push:
    branches: [master, "fix/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ["22.12.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
        env:
          DO_NOT_TRACK: "1"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm run build:xerj
      - run: npm test
        env:
          DO_NOT_TRACK: "1"
